<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/reisotor-icon-circle.svg" />
    <!-- iOS Safari unterstützt kein SVG für apple-touch-icon (nur PNG) - ohne diesen Tag fällt
         "Zum Home-Bildschirm hinzufügen" auf einen automatisch generierten Screenshot-Icon zurück. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#9141AC" />
    <script>
      (function () {
        try {
          var c = localStorage.getItem('reisotor-primary-color');
          if (c && /^#[0-9a-fA-F]{6}$/.test(c)) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', c);
            if (c.toLowerCase() !== '#9141ac') {
              document.documentElement.style.setProperty('--color-primary', c);
            }
          }
        } catch (_) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reisotor" />
    <title>Reisotor</title>
    <link rel="preload" href="/fonts/fira-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/architects-daughter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Inline statt über style.css: dieser Splash muss bereits sichtbar sein, BEVOR main.ts (ESM,
         lädt Vue/Pinia/Router) überhaupt zu laden anfängt - vorher stand hier bis zum ersten Render
         nur eine komplett leere Seite (#149). Nutzt bewusst dieselbe Gradient-Optik wie
         LoginView.vue/SplashScreen.vue, aber kein Vue-Bauteil (kann hier noch nicht laufen). Farben
         hartkodiert (keine CSS-Variablen verfügbar) - Light-Wert aus style.css's --color-bg/
         --color-primary(-tint), Dark-Gegenpart per prefers-color-scheme (der manuelle [data-theme]-
         Override aus stores/theme.ts greift erst nach dem Vue-Mount, siehe main.ts). -->
    <style>
      #splash {
        --splash-primary: var(--color-primary, #9141ac);
        --splash-primary-light: color-mix(in srgb, var(--splash-primary) 62%, white);
        --splash-accent: #1e96d1;
        --splash-disc: color-mix(in srgb, var(--splash-primary) 10%, #ffffff);
        --splash-track: color-mix(in srgb, var(--splash-primary) 18%, transparent);
        --splash-lens-core: color-mix(in srgb, var(--splash-primary) 30%, black);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(160deg, #f6eff9, #faf8f5 60%);
        transition: opacity 0.25s ease;
      }
      #splash img {
        width: 140px;
        height: 140px;
        animation: splash-bob 3.2s ease-in-out infinite;
      }
      #splash .splash-spinner {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      #splash .splash-spinner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #splash .splash-spinner-disc {
        fill: var(--splash-disc);
      }
      #splash .splash-spinner-track {
        stroke: var(--splash-track);
      }
      #splash .splash-spinner-arc-outer {
        transform-origin: 16px 16px;
        animation: splash-spin 1.25s cubic-bezier(0.52, 0.14, 0.48, 0.86) infinite;
      }
      #splash .splash-spinner-arc-inner {
        stroke: var(--splash-accent);
        opacity: 0.65;
        transform-origin: 16px 16px;
        animation: splash-spin-rev 1.8s linear infinite;
      }
      #splash .splash-spinner-lens-core {
        fill: var(--splash-lens-core);
        transform-origin: 16px 16px;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      #splash .splash-spinner-glint-orbit {
        transform-origin: 16px 16px;
        animation: splash-spin-rev 2.5s linear infinite;
      }
      #splash .splash-spinner-glint {
        fill: var(--splash-accent);
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(0.6deg);
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-spin-rev {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(0.86);
        }
        50% {
          transform: scale(1.1);
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          --splash-primary: var(--color-primary, #cf77dd);
          --splash-accent: #52b8ea;
          --splash-disc: color-mix(in srgb, var(--splash-primary) 18%, #22201d);
          background: linear-gradient(160deg, #352538, #181715 60%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .splash-spinner-arc-outer,
        #splash .splash-spinner-arc-inner,
        #splash .splash-spinner-lens-core,
        #splash .splash-spinner-glint-orbit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/reisotor-icon-blank.svg" alt="" width="140" height="140" />
      <span class="splash-spinner" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="splash-spinner-grad" x1="10%" y1="95%" x2="90%" y2="5%">
              <stop offset="0%" stop-color="var(--splash-primary)" />
              <stop offset="100%" stop-color="var(--splash-primary-light)" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="13.5" class="splash-spinner-disc" />
          <circle cx="16" cy="16" r="12" class="splash-spinner-track" stroke-width="2.3" />
          <circle
            class="splash-spinner-arc-outer"
            cx="16"
            cy="16"
            r="12"
            pathLength="100"
            stroke="url(#splash-spinner-grad)"
            stroke-width="2.6"
            stroke-dasharray="34 66"
            stroke-linecap="round"
          />
          <circle
            class="splash-spinner-arc-inner"
            cx="16"
            cy="16"
            r="8.1"
            pathLength="100"
            stroke-width="2"
            stroke-dasharray="28 72"
            stroke-linecap="round"
          />
          <circle class="splash-spinner-lens-core" cx="16" cy="16" r="4.6" />
          <g class="splash-spinner-glint-orbit">
            <circle class="splash-spinner-glint" cx="17.6" cy="14.3" r="1.25" />
          </g>
        </svg>
      </span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
