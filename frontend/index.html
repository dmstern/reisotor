<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/reisotor-icon-circle.svg" />
    <!-- iOS Safari unterstützt kein SVG für apple-touch-icon (nur PNG) - ohne diesen Tag fällt
         "Zum Home-Bildschirm hinzufügen" auf einen automatisch generierten Screenshot-Icon zurück. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#9141AC" />
    <script>
      (function () {
        try {
          var c = localStorage.getItem('reisotor-primary-color');
          if (c && /^#[0-9a-fA-F]{6}$/.test(c)) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', c);
            if (c.toLowerCase() !== '#9141ac') {
              document.documentElement.style.setProperty('--color-primary', c);
            }
          }
        } catch (_) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reisotor" />
    <title>Reisotor</title>
    <link rel="preload" href="/fonts/fira-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/architects-daughter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Inline statt über style.css: dieser Splash muss bereits sichtbar sein, BEVOR main.ts (ESM,
         lädt Vue/Pinia/Router) überhaupt zu laden anfängt - vorher stand hier bis zum ersten Render
         nur eine komplett leere Seite (#149). Nutzt bewusst dieselbe Gradient-Optik wie
         LoginView.vue/SplashScreen.vue, aber kein Vue-Bauteil (kann hier noch nicht laufen). Farben
         hartkodiert (keine CSS-Variablen verfügbar) - Light-Wert aus style.css's --color-bg/
         --color-primary(-tint), Dark-Gegenpart per prefers-color-scheme (der manuelle [data-theme]-
         Override aus stores/theme.ts greift erst nach dem Vue-Mount, siehe main.ts). -->
    <style>
      #splash {
        --splash-primary: var(--color-primary, #9141ac);
        --splash-primary-light: color-mix(in srgb, var(--splash-primary) 62%, white);
        --splash-accent: #1e96d1;
        --splash-visor-bg: color-mix(in srgb, var(--splash-primary) 10%, #ffffff);
        --splash-spark: white;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(160deg, #f6eff9, #faf8f5 60%);
        transition: opacity 0.25s ease;
      }
      #splash img {
        width: 140px;
        height: 140px;
        animation: splash-bob 3.2s ease-in-out infinite;
      }
      #splash .splash-spinner {
        width: 30px;
        height: 19px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      #splash .splash-spinner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #splash .splash-spinner-visor {
        fill: var(--splash-visor-bg);
      }
      #splash .splash-spinner-scan-rail {
        stroke: var(--splash-accent);
        stroke-opacity: 0.22;
        stroke-width: 2;
      }
      #splash .splash-spinner-scan-glow {
        fill: var(--splash-accent);
        opacity: 0.28;
        animation: splash-scan 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) 0.06s infinite backwards;
      }
      #splash .splash-spinner-scan-dot {
        fill: var(--splash-accent);
        animation: splash-scan 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      #splash .splash-spinner-scan-spark {
        fill: var(--splash-spark);
        animation: splash-scan 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(0.6deg);
        }
      }
      @keyframes splash-scan {
        0%,
        100% {
          transform: translateX(-6px);
        }
        50% {
          transform: translateX(6px);
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          --splash-primary: var(--color-primary, #cf77dd);
          --splash-accent: #52b8ea;
          --splash-visor-bg: color-mix(in srgb, var(--splash-primary) 18%, #22201d);
          background: linear-gradient(160deg, #352538, #181715 60%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .splash-spinner-scan-glow,
        #splash .splash-spinner-scan-dot,
        #splash .splash-spinner-scan-spark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/reisotor-icon-blank.svg" alt="" width="140" height="140" />
      <span class="splash-spinner" aria-hidden="true">
        <svg viewBox="0 0 32 20" fill="none">
          <defs>
            <linearGradient id="splash-spinner-grad" x1="10%" y1="95%" x2="90%" y2="5%">
              <stop offset="0%" stop-color="var(--splash-primary)" />
              <stop offset="100%" stop-color="var(--splash-primary-light)" />
            </linearGradient>
          </defs>
          <rect
            x="2"
            y="2.5"
            width="28"
            height="15"
            rx="7.5"
            class="splash-spinner-visor"
            stroke="url(#splash-spinner-grad)"
            stroke-width="2.2"
          />
          <line
            x1="8.5"
            y1="10"
            x2="23.5"
            y2="10"
            class="splash-spinner-scan-rail"
            stroke-linecap="round"
          />
          <circle class="splash-spinner-scan-glow" cx="16" cy="10" r="3.8" />
          <circle class="splash-spinner-scan-dot" cx="16" cy="10" r="2.6" />
          <circle class="splash-spinner-scan-spark" cx="16" cy="10" r="1.05" />
        </svg>
      </span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
