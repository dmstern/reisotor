version: 2
updates:
  # 1. Root npm (Tooling, Linter, Prettier)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # typescript-eslint unterstützt TypeScript 6/7 noch nicht stabil; monorepo-weit auf v5.x synchron halten.
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']

  # 2. Backend npm (Fastify, SQLite, Vitest)
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Fastify v5 und die zugehörigen @fastify/*-Major-Updates müssen gemeinsam migriert werden (siehe Issue #578),
      # da isolierte Einzel-PRs an Peer-Dependency-Konflikten (fastify-plugin ^5.x / ^6.x) scheitern.
      - dependency-name: 'fastify'
        versions: ['>= 5.0.0']
      - dependency-name: '@fastify/cookie'
        versions: ['>= 10.0.0']
      - dependency-name: '@fastify/cors'
        versions: ['>= 10.0.0']
      - dependency-name: '@fastify/session'
        versions: ['>= 11.0.0']
      - dependency-name: '@fastify/static'
        versions: ['>= 8.0.0']
      # Für better-sqlite3 v13 fehlen im Playwright-CI-Container (Ubuntu Jammy / Node 22) vorkompilierte Binaries (prebuild-install),
      # wodurch node-gyp mangels installiertem 'make' abbricht. Ab v14.0.0 prüft Dependabot automatisch erneut.
      - dependency-name: 'better-sqlite3'
        versions: ['>= 13.0.0, < 14.0.0']
      # TypeScript monorepo-weit synchron auf v5.x halten.
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']
      # vitest v5 setzt 'vite' als Dependency voraus; Backend ist eine reine Fastify-App ohne Vite.
      - dependency-name: 'vitest'
        versions: ['>= 5.0.0']

  # 3. Frontend npm (Vue 3, Vite, Storybook)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # vue-tsc 2.x und Toolchain unterstützen TypeScript 6/7 noch nicht; monorepo-weit auf v5.x halten.
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']
      # Storybook v10 erfordert ein abgestimmtes manuelles Upgrade aller Addons und Tooling.
      - dependency-name: 'storybook'
        versions: ['>= 9.0.0']
      - dependency-name: '@storybook/*'
        versions: ['>= 9.0.0']

  # 4. E2E npm (Playwright, Axe)
  - package-ecosystem: 'npm'
    directory: '/e2e'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Für better-sqlite3 v13 fehlen im Playwright-CI-Container (Ubuntu Jammy / Node 22) vorkompilierte Binaries (prebuild-install),
      # wodurch node-gyp mangels installiertem 'make' abbricht. Ab v14.0.0 prüft Dependabot automatisch erneut.
      - dependency-name: 'better-sqlite3'
        versions: ['>= 13.0.0, < 14.0.0']

  # 5. GitHub Actions Workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
