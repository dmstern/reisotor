version: 2
updates:
  # 1. Root npm (Tooling, Linter, Prettier)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # 2. Backend npm (Fastify, SQLite, Vitest)
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # 3. Frontend npm (Vue 3, Vite, Storybook)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # 4. E2E npm (Playwright, Axe)
  - package-ecosystem: 'npm'
    directory: '/e2e'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # 5. GitHub Actions Workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
