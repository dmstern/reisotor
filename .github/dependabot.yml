version: 2
updates:
  # 1. Root npm (Tooling, Linter, Prettier)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # typescript-eslint unterstützt TypeScript 7.0 noch nicht (Support erst ab TS >= 7.1 geplant, siehe typescript-eslint#10940).
      # Durch >= 7.0.0, < 7.1.0 meldet sich Dependabot automatisch wieder, sobald TypeScript 7.1 erscheint.
      - dependency-name: 'typescript'
        versions: ['>= 7.0.0, < 7.1.0']

  # 2. Backend npm (Fastify, SQLite, Vitest)
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # @fastify/cookie v11+ setzt Fastify v5 (fastify-plugin ^6.0.0) voraus; Backend läuft aktuell auf Fastify v4.
      - dependency-name: '@fastify/cookie'
        versions: ['>= 11.0.0']
      # Für better-sqlite3 v13 fehlen im Playwright-CI-Container (Ubuntu Jammy / Node 22) vorkompilierte Binaries (prebuild-install),
      # wodurch node-gyp mangels installiertem 'make' abbricht.
      - dependency-name: 'better-sqlite3'
        versions: ['>= 13.0.0']

  # 3. Frontend npm (Vue 3, Vite, Storybook)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # 4. E2E npm (Playwright, Axe)
  - package-ecosystem: 'npm'
    directory: '/e2e'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 21
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Für better-sqlite3 v13 fehlen im Playwright-CI-Container (Ubuntu Jammy / Node 22) vorkompilierte Binaries (prebuild-install),
      # wodurch node-gyp mangels installiertem 'make' abbricht.
      - dependency-name: 'better-sqlite3'
        versions: ['>= 13.0.0']

  # 5. GitHub Actions Workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
