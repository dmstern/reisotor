name: Build & Deploy

# Baut Frontend + Backend bei Push auf main ODER prod und veröffentlicht das Ergebnis als
# einzigen Commit auf einem Ziel-Branch. Push auf main -> "deploy-staging" (dev.reise.ruebenherz.de,
# automatisches Gate zum Anschauen einer Änderung). Push auf prod -> "deploy" (reise.ruebenherz.de,
# die von Nutzer:innen tatsächlich verwendete Produktion). main wird erst manuell auf prod gepusht
# ("git push origin main:prod"), sobald das Staging-Ergebnis geprüft wurde.
#
# Der eigentliche Rollout auf den Ziel-Server (Raspberry Pi) passiert NICHT hier, sondern per
# Cronjob auf dem Server selbst, der den jeweiligen Branch pollt (siehe README.md, Abschnitt
# "Automatisiertes Deployment über GitHub Actions + Pi-Cronjob") – so ist der Server nie darauf
# angewiesen, dass ein Client (Laptop/Handy) online ist oder Zugangsdaten hält.
#
# Zusätzlich auf pull_request gegen main: derselbe komplette Test-Umfang wie bei einem Push
# (Backend-/Frontend-Unit-Tests + Build UND die volle e2e-Suite) - nur der eigentliche
# Publish-Schritt (Deploy-Branch) bleibt push-only, ein noch ungemergter Branch darf nie
# veröffentlicht werden. Ursprünglich gab es hier einen Kompromiss ohne e2e auf PRs (schnellere
# PR-Checks), der sich aber als falsche Abwägung erwiesen hat: e2e ist das eigentliche
# Regressionsnetz fürs UI-Verhalten, ohne sie fielen mehrere echte Fehlschläge erst NACH dem
# Merge auf main auf statt schon vorher auf dem PR.

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwrights offizielles Image bringt Chromium UND sämtliche System-Bibliotheken dafür schon
    # fertig mit - erspart bei jedem Lauf das (undgecachte, weil auf einer frischen Runner-VM
    # jedes Mal neue) `apt-get install` von ~100 Paketen, das vorher den Löwenanteil der Laufzeit
    # ausmachte (siehe Issue-Diskussion). Image-Tag MUSS exakt zur in e2e/package-lock.json
    # gepinnten @playwright/test-Version passen (v1.62.1 -> v1.62.1-jammy), sonst driftet die im
    # Image enthaltene Chromium-Revision von der per npm installierten @playwright/test-Version
    # auseinander. Bei jedem Playwright-Versions-Bump also diesen Tag mitziehen.
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # bcrypt (backend) und better-sqlite3 (backend/e2e) laden i. d. R. vorgebaute Binaries
      # (prebuild-install) und brauchen dafür keinen Compiler - dieser Schritt ist nur eine
      # günstige Absicherung für den Fall, dass für eine Node-/libc-Kombination doch kein
      # passendes Prebuild existiert und auf Source-Build zurückgefallen wird. Deutlich kleinerer
      # Paket-Umfang als die vorherigen Playwright-System-Deps, fällt bei der Laufzeit kaum ins
      # Gewicht.
      - name: Install native build tools (bcrypt/better-sqlite3 fallback)
        run: apt-get update && apt-get install -y --no-install-recommends python3 make g++

      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Assemble release artifact
        if: github.event_name == 'push'
        run: |
          rm -rf release
          mkdir -p release/frontend release/backend/dist
          cp -r frontend/dist/. release/frontend/
          cp -r backend/dist/. release/backend/dist/
          cp backend/package.json backend/package-lock.json release/backend/
          printf '%s %s\n' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/COMMIT

      - name: Determine target branch
        if: github.event_name == 'push'
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "branch=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "branch=deploy-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to deploy branch
        if: github.event_name == 'push'
        working-directory: release
        run: |
          TARGET="${{ steps.target.outputs.branch }}"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$TARGET"
          git add -A
          git commit -q -m "Build ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET:$TARGET"
